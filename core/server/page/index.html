<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Menitor</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6f5e'/%3E%3Cpath d='M9 22V10l7 7 7-7v12' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div id="app" class="app">
      <header class="bar">
        <span class="brand" aria-hidden="true">M</span>
        <span id="project" class="project">Menitor</span>
        <span id="live" class="live" data-state="connecting" role="status" aria-live="polite">Connecting</span>
        <button id="popout" class="ghost" type="button" hidden>Pop out</button>
      </header>

      <p id="banner" class="banner" role="status" hidden></p>

      <main id="main">
        <section id="card" class="card" aria-live="polite" aria-busy="true">
          <p class="muted">Loading the current task…</p>
        </section>

        <section id="progress" class="progress" aria-label="Progress" hidden></section>
      </main>
    </div>

    <div id="away" class="away" hidden>
      <p>The card is in the pop-out window.</p>
      <button id="bring-back" type="button">Bring it back</button>
    </div>

    <div id="toast" class="toast" role="status" aria-live="assertive" hidden></div>
  </body>
</html>
